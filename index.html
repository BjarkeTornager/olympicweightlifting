<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f3ef">
    <meta name="color-scheme" content="light">
    <meta name="description" content="A private, offline-first Olympic weightlifting training log.">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lift Journal">

    <title>Lift Journal</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#app-content">Skip to content</a>

    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="#dashboard" aria-label="Lift Journal home">
          <span class="brand-mark" aria-hidden="true">LJ</span>
          <span class="brand-copy">
            <strong>Lift Journal</strong>
            <small>Weightlifting log</small>
          </span>
        </a>

        <nav class="desktop-nav" aria-label="Primary">
          <a href="#dashboard" data-route-link="dashboard">Home</a>
          <a href="#workout" data-route-link="workout">Workout</a>
          <a href="#history" data-route-link="history">History</a>
          <a href="#progress" data-route-link="progress">Progress</a>
          <a href="#library" data-route-link="library">Library</a>
        </nav>

        <div class="header-actions">
          <span class="network-status" id="network-status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-label">Online</span>
          </span>
          <a class="button button-quiet button-compact" href="#data" data-route-link="data">Data</a>
        </div>
      </div>
    </header>

    <main id="app-content" class="app-main" tabindex="-1">
      <div class="initial-loader" aria-live="polite">
        <span class="loader-mark" aria-hidden="true"></span>
        Loading your journal…
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Primary mobile navigation">
      <a href="#dashboard" data-route-link="dashboard">Home</a>
      <a href="#workout" data-route-link="workout">Workout</a>
      <a href="#history" data-route-link="history">History</a>
      <a href="#progress" data-route-link="progress">Progress</a>
      <a href="#library" data-route-link="library">Library</a>
    </nav>

    <dialog class="app-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <div class="dialog-copy">
          <p class="eyebrow">Please confirm</p>
          <h2 id="confirm-title">Confirm action</h2>
          <p id="confirm-message"></p>
        </div>
        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel">Cancel</button>
          <button class="button button-danger" id="confirm-action" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>

    <dialog class="app-dialog" id="pr-dialog" aria-labelledby="pr-dialog-title">
      <form method="dialog" id="pr-suggestion-form">
        <div class="dialog-copy">
          <p class="eyebrow">Possible new best</p>
          <h2 id="pr-dialog-title">Update your PRs?</h2>
          <p>These successful lifts are above the PRs currently saved in the app.</p>
        </div>
        <div id="pr-suggestion-list" class="check-list"></div>
        <div class="dialog-actions">
          <button class="button button-quiet" value="skip">Not now</button>
          <button class="button button-primary" value="apply">Update selected</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <noscript>
      <div class="noscript-message">Lift Journal needs JavaScript to log and store workouts.</div>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
