<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f4ef">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
    <title>Refresh · Lift Journal</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./js/refresh.js"></script>
  </head>
  <body>
    <main class="app-main">
      <section class="page card" aria-labelledby="refresh-title">
        <p class="eyebrow">Lift Journal</p>
        <h1 id="refresh-title">Refreshing your journal…</h1>
        <p id="refresh-status" role="status">Getting the latest programs. Your saved workouts and PRs stay on this device.</p>
        <button id="refresh-retry" class="button button-primary" type="button" hidden>Try again</button>
        <a class="text-action" href="./#workout">Return to your journal</a>
        <noscript><p>Enable JavaScript to refresh your journal.</p></noscript>
      </section>
    </main>
  </body>
</html>
