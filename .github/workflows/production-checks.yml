name: Production checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: lift
          POSTGRES_DB: lift_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lift -d lift_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lift:ci-only-password@localhost:5432/lift_test
      TEST_DATABASE_URL: postgresql://lift:ci-only-password@localhost:5432/lift_test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:34173
      ALLOWED_EMAILS: ci@example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check:production
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
