name: Production checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # About 18 minutes normally; a hung step fails instead of holding a
    # merge and a deploy for GitHub's six-hour default.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: lift
          POSTGRES_DB: lift_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lift -d lift_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lift:ci-only-password@localhost:5432/lift_test
      TEST_DATABASE_URL: postgresql://lift:ci-only-password@localhost:5432/lift_test
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:34173
      ALLOWED_EMAILS: ci@example.test
      OWNER_EMAIL: ci@example.test
      VIDEO_PYTHON_PATH: /tmp/lift-video-env/bin/python
      VIDEO_POSE_MODEL_PATH: /tmp/lift-video-model/pose.task
      MPLCONFIGDIR: /tmp/lift-video-matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # A slow package mirror once held this step for over two hours. Each
      # attempt gets four minutes, and a hung one is tried again.
      - name: Install system packages
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get update &&
              sudo timeout 240 apt-get install -y ffmpeg python3-venv libseccomp2 libgl1 libglib2.0-0 &&
              exit 0
            echo "Package install attempt $attempt failed or timed out."
            sleep 10
          done
          exit 1
      - run: python3 -m venv /tmp/lift-video-env && /tmp/lift-video-env/bin/pip install -r scripts/video/requirements.txt && /tmp/lift-video-env/bin/python scripts/video/install_model.py /tmp/lift-video-model/pose.task
      - run: npm ci
      - run: npm run db:migrate
      - run: /tmp/lift-video-env/bin/python scripts/video/test_analysis.py
      - run: /tmp/lift-video-env/bin/python scripts/video/test_overlay_recovery.py
      - run: npm run check:production
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      # The Restate endpoint in the standalone build, with its bundled SDK.
      - run: node --import tsx scripts/restate-smoke.ts
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 15
      - run: npm run test:browser -- --project=chromium --project=firefox
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-report-linux
          path: playwright-report/
  safari:
    # Linux WebKit's GStreamer decoder reports different paused-frame media
    # timestamps for the H.264 fixture. Use native WebKit for Safari coverage
    # so source-pixel and frame-alignment assertions remain strict.
    runs-on: macos-latest
    # About 15 minutes normally.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npm run test:browser -- --project=webkit
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-report-safari
          path: playwright-report/
